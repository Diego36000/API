<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Admin Pannel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .card.visible { display: flex; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; }
    p { color: #475569; font-size: .9rem; line-height: 1.6; margin-bottom: 1rem; }
    code {
      background: #f1f5f9;
      border-radius: 6px;
      padding: .2rem .5rem;
      font-size: .85rem;
      color: #6366f1;
    }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .7rem 1.5rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
    }
    button:hover { background: #4338ca; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" class="card visible">
    <div class="spinner"></div>
    <h1>Conectando...</h1>
    <p>Iniciando conexión con el servidor.</p>
  </div>

  <div id="error" class="card">
    <div class="icon">⚠️</div>
    <h1>Servidor no disponible</h1>
    <p>No se puede conectar con el servidor. Asegúrate de que Docker está corriendo:</p>
    <p><code>docker compose up</code></p>
    <button onclick="connect()">Reintentar</button>
  </div>

  <script src="neutralino.js"></script>
  <script>
    const API_URL = 'https://localhost:8080';

    try { Neutralino.init(); } catch (e) { console.warn('Neutralino.init error:', e); }

    function show(id) {
      document.getElementById('loading').classList.remove('visible');
      document.getElementById('error').classList.remove('visible');
      document.getElementById(id).classList.add('visible');
    }

    async function connect() {
      show('loading');
      try {
        // mode: no-cors — respuesta opaca pero detecta si el servidor está activo
        await fetch(API_URL + '/login', {
          mode: 'no-cors',
          signal: AbortSignal.timeout(5000)
        });
        window.location.href = API_URL + '/login';
      } catch (e) {
        console.error('connect error:', e);
        show('error');
      }
    }

    connect();
  </script>
</body>
</html>
