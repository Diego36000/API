<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>NekoPop Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; }
    p { color: #475569; font-size: .9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    code {
      background: #f1f5f9;
      border-radius: 6px;
      padding: .2rem .5rem;
      font-size: .85rem;
      color: #6366f1;
    }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .7rem 1.5rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Servidor no disponible</h1>
    <p>No se puede conectar con el servidor. Asegúrate de que Docker está corriendo:</p>
    <p><code>docker compose up</code></p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
