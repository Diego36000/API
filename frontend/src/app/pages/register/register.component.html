<div class="auth-wrap">

  <div class="auth-left">
    <div class="brand">
      <div class="brand-logo">🏷️</div>
      <h1>Mercado</h1>
      <p class="tagline">Tu próxima gran compra<br>está a un clic de distancia.</p>
      <ul class="features">
        <li><span class="check">✓</span> Gratis para publicar</li>
        <li><span class="check">✓</span> Llega a miles de compradores</li>
        <li><span class="check">✓</span> Gestiona todo desde un lugar</li>
      </ul>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="logo-mobile">🏷️ Mercado</div>

      <h2>Crear cuenta</h2>
      <p class="subtitle">Empieza a comprar y vender hoy</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="name">Nombre</label>
          <input id="name" type="text" [(ngModel)]="name" name="name"
            placeholder="Tu nombre" required autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email"
            placeholder="tú@ejemplo.com" required autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" [(ngModel)]="password" name="password"
            placeholder="Mínimo 8 caracteres" required autocomplete="new-password" />
        </div>

        @if (errorMessage) {
          <div class="error-msg">{{ errorMessage }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Creando cuenta...' : 'Crear cuenta →' }}
        </button>
      </form>

      <p class="auth-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
      </p>
    </div>
  </div>

</div>
